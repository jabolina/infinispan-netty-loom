- name: Install dependencies on all nodes
  hosts: instances
  vars:
    setup: false
    sdkman_folder: "/home/{{ ansible_user }}/.sdkman"
    jdk_version: "25.0.2-open"
    loom_base_url: "https://builds.shipilev.net/openjdk-jdk-loom"
    loom_jdk: ""
    loom_install_dir: "/home/{{ ansible_user }}/loom-jdk"
    asprof_version: "4.4"
    asprof_install_dir: "/home/{{ ansible_user }}/async-profiler"
  tasks:
    - name: Install system packages
      package:
        name: "{{ item }}"
        state: present
      become: true
      loop: [unzip, zip, rsync, "{{ 'linux-tools-' ~ ansible_kernel if ansible_os_family == 'Debian' else 'perf' }}"]
      when: setup | bool

    - name: Allow unprivileged perf events
      ansible.builtin.sysctl:
        name: kernel.perf_event_paranoid
        value: "-1"
      become: true
      when: setup | bool

    - name: Install xz for Loom JDK extraction
      package:
        name: "{{ 'xz-utils' if ansible_os_family == 'Debian' else 'xz' }}"
        state: present
      become: true
      when: setup | bool

    - name: Install SDKMAN
      ansible.builtin.shell: "curl -s 'https://get.sdkman.io' | bash"
      args:
        creates: "{{ sdkman_folder }}/etc/config"
      when: setup | bool

    - name: Configure SDKMAN auto-answer
      ansible.builtin.shell: |
        sed -i 's/sdkman_auto_answer=false/sdkman_auto_answer=true/g' "{{ sdkman_folder }}/etc/config"
      when: setup | bool

    - name: Install JDK {{ jdk_version }}
      ansible.builtin.shell: |
        source {{ sdkman_folder }}/bin/sdkman-init.sh
        sdk install java {{ jdk_version }}
      args:
        executable: /bin/bash
      register: jdk_install
      until: jdk_install.rc == 0
      retries: 5
      delay: 10
      when: setup | bool

    - name: Install JBang
      ansible.builtin.shell: |
        source {{ sdkman_folder }}/bin/sdkman-init.sh
        sdk install jbang
      args:
        executable: /bin/bash
      register: jbang_install
      until: jbang_install.rc == 0
      retries: 5
      delay: 10
      when: setup | bool

    - name: Clean SDKMAN cache
      ansible.builtin.shell: |
        source {{ sdkman_folder }}/bin/sdkman-init.sh
        sdk flush
      args:
        executable: /bin/bash
      when: setup | bool

    - name: Symlink SDKMAN binaries to PATH
      ansible.builtin.file:
        src: "{{ sdkman_folder }}/candidates/{{ item }}/current/bin/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        state: link
      become: true
      loop: [java, jbang]
      when: setup | bool

    - name: Install Loom JDK
      when: setup | bool
      block:
        - name: Resolve Loom JDK architecture
          ansible.builtin.set_fact:
            loom_arch: "{{ ansible_facts.architecture }}"
          when: loom_jdk | length == 0

        - name: Download Loom JDK from Shipilev
          ansible.builtin.get_url:
            url: "{{ loom_base_url }}/openjdk-jdk-loom-linux-{{ loom_arch }}-server.tar.xz"
            dest: "/home/{{ ansible_user }}/loom-jdk.tar.xz"
          when: loom_jdk | length == 0
          register: loom_download

        - name: Upload custom Loom JDK
          ansible.builtin.copy:
            src: "{{ loom_jdk }}"
            dest: "/home/{{ ansible_user }}/loom-jdk.tar.xz"
          when: loom_jdk | length > 0
          register: loom_upload

        - name: Check if Loom JDK is already extracted
          ansible.builtin.stat:
            path: "{{ loom_install_dir }}/bin/java"
          register: loom_java_bin

        - name: Remove previous Loom JDK installation
          ansible.builtin.file:
            path: "{{ loom_install_dir }}"
            state: absent
          when: loom_download is changed or loom_upload is changed or not loom_java_bin.stat.exists

        - name: Create Loom JDK directory
          ansible.builtin.file:
            path: "{{ loom_install_dir }}"
            state: directory

        - name: Extract Loom JDK
          ansible.builtin.shell: |
            tar -xf /home/{{ ansible_user }}/loom-jdk.tar.xz -C {{ loom_install_dir }} --strip-components=1
          args:
            executable: /bin/bash
            creates: "{{ loom_install_dir }}/bin/java"

        - name: Check for lib/server directory
          ansible.builtin.stat:
            path: "{{ loom_install_dir }}/lib/server"
          register: loom_lib_server

        - name: Symlink release JVM as server
          ansible.builtin.file:
            src: "{{ loom_install_dir }}/lib/release"
            dest: "{{ loom_install_dir }}/lib/server"
            state: link
            force: true
          when: not loom_lib_server.stat.exists

        - name: Verify Loom JDK
          ansible.builtin.shell: "{{ loom_install_dir }}/bin/java -version"
          register: loom_version

        - name: Show Loom JDK version
          ansible.builtin.debug:
            msg: "{{ loom_version.stderr_lines }}"

    - name: Install async-profiler
      when: setup | bool
      block:
        - name: Resolve async-profiler architecture
          ansible.builtin.set_fact:
            asprof_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'x64' }}"

        - name: Download async-profiler {{ asprof_version }}
          ansible.builtin.get_url:
            url: "https://github.com/async-profiler/async-profiler/releases/download/v{{ asprof_version }}/async-profiler-{{ asprof_version }}-linux-{{ asprof_arch }}.tar.gz"
            dest: "/home/{{ ansible_user }}/async-profiler.tar.gz"

        - name: Remove previous async-profiler installation
          ansible.builtin.file:
            path: "{{ asprof_install_dir }}"
            state: absent

        - name: Create async-profiler directory
          ansible.builtin.file:
            path: "{{ asprof_install_dir }}"
            state: directory

        - name: Extract async-profiler
          ansible.builtin.unarchive:
            src: "/home/{{ ansible_user }}/async-profiler.tar.gz"
            dest: "{{ asprof_install_dir }}"
            remote_src: true
            extra_opts: [--strip-components=1]

        - name: Symlink asprof to PATH
          ansible.builtin.file:
            src: "{{ asprof_install_dir }}/bin/asprof"
            dest: /usr/local/bin/asprof
            state: link
          become: true

        - name: Verify async-profiler
          ansible.builtin.shell: asprof --version
          register: asprof_version_check
          changed_when: false

        - name: Show async-profiler version
          ansible.builtin.debug:
            msg: "{{ asprof_version_check.stdout_lines }}"

- name: Set up SSH from controller to agent nodes
  hosts: instances
  tasks:
    - name: Generate SSH key pair on controller
      ansible.builtin.shell: |
        ssh-keygen -t rsa -b 4096 -f /home/{{ ansible_user }}/.ssh/id_rsa -N ""
      args:
        creates: /home/{{ ansible_user }}/.ssh/id_rsa
      when:
        - groups['agents'] | default([]) | length > 0
        - inventory_hostname in groups['controller']

    - name: Read controller public key
      ansible.builtin.slurp:
        src: /home/{{ ansible_user }}/.ssh/id_rsa.pub
      register: controller_pubkey
      when:
        - groups['agents'] | default([]) | length > 0
        - inventory_hostname in groups['controller']

    - name: Disable strict host key checking on controller
      ansible.builtin.copy:
        content: |
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
        dest: /home/{{ ansible_user }}/.ssh/config
        mode: "0600"
      when:
        - groups['agents'] | default([]) | length > 0
        - inventory_hostname in groups['controller']

    - name: Add controller public key to authorized_keys
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars[groups['controller'][0]].controller_pubkey.content | b64decode }}"
        state: present
      when:
        - groups['agents'] | default([]) | length > 0
        - inventory_hostname in groups['agents']
        - hostvars[groups['controller'][0]].controller_pubkey is defined

    - name: Suppress SSH login banner on agent nodes
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.hushlogin
        state: touch
      when:
        - groups['agents'] | default([]) | length > 0
        - inventory_hostname in groups['agents']

- name: Deploy Infinispan server to cluster nodes
  hosts: "instances:!controller:!agents"
  vars:
    remote_folder: "/home/{{ ansible_user }}/infinispan"
  tasks:
    - name: Remove previous deployment
      ansible.builtin.file:
        state: absent
        path: "{{ remote_folder }}"

    - name: Upload Infinispan distribution
      ansible.posix.synchronize:
        src: "{{ ispn_dist }}/"
        dest: "{{ remote_folder }}"

    - name: Collect private IPs from all server nodes
      ansible.builtin.set_fact:
        server_ips: "{{ server_ips | default([]) + [hostvars[item].ansible_facts.default_ipv4.address] }}"
      loop: "{{ groups['instances'] | difference(groups['controller']) | difference(groups['agents'] | default([])) }}"

    - name: Render server configuration
      ansible.builtin.template:
        src: infinispan.xml.j2
        dest: "{{ remote_folder }}/server/conf/infinispan.xml"

    - name: Generate hosts.txt for TCPPING discovery
      ansible.builtin.template:
        src: hosts.txt.j2
        dest: "{{ remote_folder }}/server/conf/hosts.txt"

    - name: Make server.sh executable
      ansible.builtin.file:
        path: "{{ remote_folder }}/bin/server.sh"
        mode: "0755"

    - name: Create admin user
      ansible.builtin.shell: |
        source /home/{{ ansible_user }}/.sdkman/bin/sdkman-init.sh
        {{ remote_folder }}/bin/cli.sh user create admin -p password -g admin
      args:
        executable: /bin/bash
      ignore_errors: true

- name: Deploy benchmark resources to controller node
  hosts: controller
  vars:
    remote_folder: "/home/{{ ansible_user }}"
  tasks:
    - name: Upload jbang-catalog
      ansible.posix.synchronize:
        src: jbang-catalog/
        dest: "{{ remote_folder }}/jbang-catalog"

    - name: Create Maven local repository directory on controller
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.m2/repository/io/hyperfoil"
        state: directory
      when: groups['agents'] | default([]) | length > 0

    - name: Upload Hyperfoil SNAPSHOT artifacts to controller Maven cache
      ansible.posix.synchronize:
        src: "{{ lookup('env', 'HOME') }}/.m2/repository/io/hyperfoil/"
        dest: "/home/{{ ansible_user }}/.m2/repository/io/hyperfoil/"
      when: groups['agents'] | default([]) | length > 0

    - name: Collect agent private IPs
      ansible.builtin.set_fact:
        agents: "{{ agents | default([]) + [hostvars[item].ansible_facts.default_ipv4.address] }}"
      loop: "{{ groups['agents'] | default([]) }}"

    - name: Resolve server node address for benchmark
      ansible.builtin.set_fact:
        benchmark_server: "{{ hostvars[groups['instances'] | difference(groups['controller']) | difference(groups['agents'] | default([])) | first].ansible_facts.default_ipv4.address }}"

    - name: Render benchmark definition
      ansible.builtin.template:
        src: hf-hr-benchmark.yaml.j2
        dest: "{{ remote_folder }}/jbang-catalog/hf-hr-benchmark.yaml"
